version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot_production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
    ports:
      # Exposes the HTTP health/monitoring endpoint (http://your-server-ip:8080/health)
      - "8080:8080"
    volumes:
      # Persistent storage for media downloads and bot logs
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.50'
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"
